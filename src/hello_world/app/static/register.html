<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - AI 私厨</title>
    <link rel="stylesheet" href="/static/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-visual">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <div class="brand-name">AI 私厨</div>
            <div class="brand-caption">从今天开始，让做饭变得简单</div>
          </div>
        </div>

        <div class="visual-copy">
          <p class="visual-kicker">START YOUR KITCHEN MEMORY</p>
          <h1>你的口味、过敏和冰箱，终于有一个地方记得住。</h1>
          <p>
            创建账号后，AI 私厨会逐步学习你的饮食偏好，并结合库存给出更适合你的菜谱。
          </p>
        </div>

        <div class="visual-points">
          <div class="visual-point">
            <strong>个人档案</strong>
            <span>记录过敏、忌口、人数和营养目标。</span>
          </div>
          <div class="visual-point">
            <strong>库存管理</strong>
            <span>看清食材数量和保质期。</span>
          </div>
          <div class="visual-point">
            <strong>对话记忆</strong>
            <span>每个账号拥有独立会话。</span>
          </div>
        </div>
      </section>

      <section class="auth-panel">
        <div class="auth-form-wrap">
          <p class="auth-kicker">开始使用</p>
          <h2>创建 AI 私厨账号</h2>
          <p class="auth-subtitle">
            用户名 3 到 32 个字符，密码至少 8 位。
          </p>

          <form class="auth-form" id="register-form">
            <label class="field">
              <span>用户名</span>
              <input
                id="username"
                name="username"
                autocomplete="username"
                minlength="3"
                maxlength="32"
                required
              />
            </label>

            <label class="field">
              <span>密码</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
              />
            </label>

            <label class="field">
              <span>确认密码</span>
              <input
                id="confirm-password"
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
              />
            </label>

            <button class="auth-submit" id="submit-button" type="submit">
              创建账号
            </button>

            <p class="auth-alert" id="auth-alert"></p>
          </form>

          <p class="auth-switch">
            已经有账号？
            <a href="/login">返回登录</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#register-form");
      const usernameInput = document.querySelector("#username");
      const passwordInput = document.querySelector("#password");
      const confirmPasswordInput = document.querySelector("#confirm-password");
      const submitButton = document.querySelector("#submit-button");
      const alert = document.querySelector("#auth-alert");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        alert.textContent = "";

        if (passwordInput.value !== confirmPasswordInput.value) {
          alert.textContent = "两次输入的密码不一致。";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "正在创建...";

        try {
          const response = await fetch("/api/v1/auth/register", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              username: usernameInput.value.trim(),
              password: passwordInput.value,
            }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.detail || "注册失败。");
          }

          window.location.href = "/";
        } catch (error) {
          alert.textContent = error.message;
          submitButton.disabled = false;
          submitButton.textContent = "创建账号";
        }
      });
    </script>
  </body>
</html>
