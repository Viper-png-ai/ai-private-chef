[project]
name = "hello-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johnson_czy", email = "3072509241@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alibabacloud-oss-v2>=1.4.0",
    "fastapi>=0.143.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.4",
    "langchain-deepseek>=1.1.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "notebook>=7.6.3",
    "PyJWT>=2.10.1",
    "bcrypt>=4.2.0",
    "openai>=3.19.2",
    "uvicorn[standard]>=0.35.0",
    "openai-whisper>=20250625",
    "python-dotenv>=1.2.3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
hello-world = "hello_world:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
